name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=20; check the floor and the current
        # releases so a version-specific regression cannot slip through.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Runtime, tests and extension packaging use the Node standard library.
      - run: npm run check
      - run: npm test
      - run: npm run pack:extension

      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: keyward-chrome
          path: dist/keyward-chrome-*.zip
          if-no-files-found: error
