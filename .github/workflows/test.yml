name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=20; check the floor and the current
        # releases so a version-specific regression cannot slip through.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # There are no dependencies to install -- the whole project runs on the
      # Node standard library, so CI is just the test suite.
      - run: npm test
